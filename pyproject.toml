[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "binetic"
version = "0.1.0"
description = "Lattice-register reservoir computing core with an optional P4 network substrate"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Proprietary - binetic.ai" }
authors = [{ name = "binetic.ai" }]
keywords = ["reservoir computing", "neuromorphic", "p4", "programmable networks", "echo state"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.20",
]

[project.optional-dependencies]
net = []                      # live substrate: stdlib sockets only
bench = []                    # benchmarks: numpy only
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["binetic*"]
